<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xの予約投稿 1か月分</title><style>
body{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:#f6f4ee;color:#2b2b2b;margin:0;padding:24px 16px 60px}
.wrap{max-width:760px;margin:0 auto}h1{font-size:1.3rem;margin:0 0 6px}
.how{background:#fff;border:1px solid #ddd6c8;border-radius:10px;padding:12px 16px;font-size:.92rem;line-height:1.7;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin:8px 0 14px}
.card{background:#fff;border:1px solid #ddd6c8;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card.done{opacity:.45}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.date{font-weight:700;color:#3d6b4a}.text{white-space:pre-wrap;line-height:1.7;font-size:.95rem;word-break:break-all}
button{font:inherit;border:0;border-radius:999px;padding:6px 16px;background:#3d6b4a;color:#fff;cursor:pointer}
button.copied{background:#b5823a}label{font-size:.85rem;white-space:nowrap;cursor:pointer}
.reset{background:#888;padding:4px 12px;font-size:.8rem}</style></head><body><div class="wrap">
<h1>Xの予約投稿 1か月分</h1>
<div class="how">2026年11月17日〜12月16日、毎日20:00の30件です。<br>
1. パソコンのブラウザで x.com を開く<br>2. 「コピー」を押して、投稿欄に貼り付ける（Ctrl+V）<br>
3. 投稿欄の下のカレンダーアイコン → 日付と時刻を設定 → 「確認する」→「予約設定」<br>4. 「予約済み」にチェック（このパソコンのこのブラウザに記録されます）</div>
<div class="bar"><span id="count"></span><button class="reset" id="reset">チェックをすべて外す</button></div>
<div id="list"></div></div><script>
const P=[{"d": "11月17日（火）20:00", "t": "タイマーのない植物ライトは、スマートプラグで毎日自動オンオフ。メダカのライトや電気毛布の消し忘れ防止にも使っています。1個買うと絶対もう1個ほしくなるので2個入りがおすすめ。\n#PR https://kurashi.lucke.jp/posts/20261116-smartplug-light-timer/"}, {"d": "11月18日（水）20:00", "t": "屋外用の灯油ボックスで外猫ハウスを作りました。出入口は対角線上に2つ、内側は断熱材と段ボールで囲んで、冬でも暖かく。作り方を順番にまとめています。\n#PR https://kurashi.lucke.jp/posts/20261115-sotoneko-house-diy/"}, {"d": "11月19日（木）20:00", "t": "猫のシステムトイレに、専用ペレットではなくヒノキの木質ペレット22kgを使っています。木の香りが強くて、おしっこのにおいが気になりにくく、しかもお得です。\n#PR https://kurashi.lucke.jp/posts/20261114-hinoki-pellet-litter/"}, {"d": "11月20日（金）20:00", "t": "白米に豆腐をのせて牡蠣だし醤油をかけるだけの豆腐ごはん。忙しい朝でも昼過ぎまで腹持ちします。ねぎやしょうがでアレンジも自在。\n#PR https://kurashi.lucke.jp/posts/20261116-tofu-gohan-busan-oden/"}, {"d": "11月21日（土）20:00", "t": "水槽と食虫植物を1台にまとめました。GEXアクアラックの下段に水槽、上段に植物、上段の裏に育成ライト。端材を敷くだけの簡単アレンジです。\n#PR https://kurashi.lucke.jp/posts/20261114-aquarack-setup/"}, {"d": "11月22日（日）20:00", "t": "外猫トイレは、トロ舟にプランターの古い土を入れて米ぬかをひとつかみ。においが出てきたらまた米ぬかを足すだけ。猫砂いらずで続けやすいです。\n#PR https://kurashi.lucke.jp/posts/20261116-sotoneko-toilet-komenuka/"}, {"d": "11月23日（月）20:00", "t": "自宅にWi-Fiがなくても、SIMを工夫すれば見守りカメラは使えます。我が家はカメラ8台を運用中。SIMの選び方とカメラ選びをまとめました。\n#PR https://kurashi.lucke.jp/posts/20261114-mimamori-camera-sim/"}, {"d": "11月24日（火）20:00", "t": "冬の窓辺で多肉植物がひょろひょろになる方へ。30cm角のパネル型育成ライトHaruDesign GL-BOARD800を紹介しました。棚1段をまとめて照らせて3年保証つきです。\n#PR https://kurashi.lucke.jp/posts/20261114-gl-board800/"}, {"d": "11月25日（水）20:00", "t": "布バッグを預け荷物にするときは、業務用の極厚ポリ袋で包んでいます。1枚50円もしないのに丈夫で、受け取ったときもカバンはきれいなままでした。\n#PR https://kurashi.lucke.jp/posts/20261116-travel-poly-bag/"}, {"d": "11月26日（木）20:00", "t": "外猫ハウスの冬支度。ヒートマットを屋外で使うなら、コンセントカバーと防雨延長コードはセットで用意するのがおすすめです。雨対策をまとめました。\n#PR https://kurashi.lucke.jp/posts/20261114-sotoneko-house-winter/"}, {"d": "11月27日（金）20:00", "t": "窓辺のキャットウォークにSPFブラケット。通り道ならショート、ゴロンと寝転がるならロング。裏にフックを付けてハンギング植物も吊るしています。\n#PR https://kurashi.lucke.jp/posts/20261116-spf-bracket-catwalk/"}, {"d": "11月28日（土）20:00", "t": "加湿器のタンク、スチコンの給水容器、食器の除菌に。パウダーでの定期的なつけ置きは欠かせません。時間がないときに使う手軽な除菌剤もあわせて紹介しています。\n#PR https://kurashi.lucke.jp/posts/20261114-jokin-kashitsuki-steam/"}, {"d": "11月29日（日）20:00", "t": "外猫ハウスの出入口は直径140mmほどあれば、ほとんどの猫が通れます。穴あけはインパクトドライバーにドリルチャックを付けて、145mmのホールソーで。\n#PR https://kurashi.lucke.jp/posts/20261115-sotoneko-house-diy/"}, {"d": "11月30日（月）20:00", "t": "人感センサーのワイヤレスチャイムで外猫の来訪をお知らせ。使い始めて1年2か月、外のセンサーの電池は一度も交換していません。\n#PR https://kurashi.lucke.jp/posts/20261114-mimamori-camera-sim/"}, {"d": "12月1日（火）20:00", "t": "SwitchBotとTapo、スマートプラグはどちらを選ぶ？答えは今持っているスマート家電と同じメーカー。アプリがひとつで済んで便利です。\n#PR https://kurashi.lucke.jp/posts/20261116-smartplug-light-timer/"}, {"d": "12月2日（水）20:00", "t": "ヒノキの木質ペレットを猫のシステムトイレに。22kgの大容量でお得です。選んだ理由と使うときの注意点を紹介しています。\n#PR https://kurashi.lucke.jp/posts/20261114-hinoki-pellet-litter/"}, {"d": "12月3日（木）20:00", "t": "韓国旅行でハマった釜山の四角おでん。日本のはんぺんよりもちもちで、刻んで炒め物にもおでんにも。よく煮込めばほわほわでやわらかくなります。\n#PR https://kurashi.lucke.jp/posts/20261116-tofu-gohan-busan-oden/"}, {"d": "12月4日（金）20:00", "t": "水槽の上に育成ライトを付けたら、水草も食虫植物も赤い部分が真っ赤に色づいて元気に育っています。アクアラックの2段活用術を紹介しました。\n#PR https://kurashi.lucke.jp/posts/20261114-aquarack-setup/"}, {"d": "12月5日（土）20:00", "t": "屋外の猫トイレのにおい対策。カインズのガーデンタブに古い土と米ぬかで、我が家はにおいにくくなりました。屋根の下に置いて、土はたまに湿らせるのがコツ。\n#PR https://kurashi.lucke.jp/posts/20261116-sotoneko-toilet-komenuka/"}, {"d": "12月6日（日）20:00", "t": "外猫ハウスの中が暖かすぎないか、冷えすぎていないかは防水の温湿度計でチェック。屋外のハウスにも置きやすく、同じものを業務用冷蔵庫の温度記録にも使っています。\n#PR https://kurashi.lucke.jp/posts/20261114-sotoneko-house-winter/"}, {"d": "12月7日（月）20:00", "t": "食虫植物や多肉植物を室内で育てるなら光の量が大事。調光なしの代わりに高さで光を調整するのがコツです。GL-BOARD800の特徴と使い方をまとめました。\n#PR https://kurashi.lucke.jp/posts/20261114-gl-board800/"}, {"d": "12月8日（火）20:00", "t": "帰りはお土産でカバンがパンパン。スーツケースを使わない旅行の預け荷物対策に45L極厚ポリ袋。旅仲間に渡したら次の旅でも再利用してくれました。\n#PR https://kurashi.lucke.jp/posts/20261116-travel-poly-bag/"}, {"d": "12月9日（水）20:00", "t": "見守りカメラ8台、1日数回チェックする使い方でほとんどの月は1GBで足ります。格安SIMやプリペイドSIMで十分まかなえます。SIMの選び方をまとめました。\n#PR https://kurashi.lucke.jp/posts/20261114-mimamori-camera-sim/"}, {"d": "12月10日（木）20:00", "t": "白いシンプルな棚受けで、窓の前に猫の特等席を作りました。耐荷重やショートとロングの違い、設置するときの注意点をまとめています。\n#PR https://kurashi.lucke.jp/posts/20261116-spf-bracket-catwalk/"}, {"d": "12月11日（金）20:00", "t": "加湿器を清潔に使いたい方へ。つけ置き除菌のやり方と、つけ置きする時間がないときの手軽な方法を紹介しています。\n#PR https://kurashi.lucke.jp/posts/20261114-jokin-kashitsuki-steam/"}, {"d": "12月12日（土）20:00", "t": "外猫ハウスの保温は季節で使い分け。寒い時期はヒートマット、ヒーターを入れるほどでもない季節は自己発熱マット。洗うのは上の毛布だけでお手入れも楽です。\n#PR https://kurashi.lucke.jp/posts/20261115-sotoneko-house-diy/"}, {"d": "12月13日（日）20:00", "t": "冬の熱帯植物にも外猫ハウスにも使えるヒートマット。屋外で電気を使うときに気をつけたい雨対策もあわせて紹介しています。\n#PR https://kurashi.lucke.jp/posts/20261114-sotoneko-house-winter/"}, {"d": "12月14日（月）20:00", "t": "システムトイレのペレット代、気になっていませんか。我が家はヒノキの木質ペレットに切り替えて、においもコストも満足しています。\n#PR https://kurashi.lucke.jp/posts/20261114-hinoki-pellet-litter/"}, {"d": "12月15日（火）20:00", "t": "60cm水槽用のGEXアクアラックは、上段も使えば植物棚になります。端材を固定して植物を置き、裏に育成ライト。省スペースで水槽と植物を一緒に楽しめます。\n#PR https://kurashi.lucke.jp/posts/20261114-aquarack-setup/"}, {"d": "12月16日（水）20:00", "t": "Wi-Fiがない環境で猫を見守るなら、プリペイドSIMが便利。20GBで約1年使えて、格安SIMの障害時の予備にもなります。\n#PR https://kurashi.lucke.jp/posts/20261114-mimamori-camera-sim/"}];const KEY="kurashi-x-schedule-2026-11";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
function count(){document.getElementById("count").textContent="予約済み "+Object.values(done).filter(Boolean).length+" / "+P.length+" 件"}
const list=document.getElementById("list");
P.forEach((p,i)=>{const c=document.createElement("div");c.className="card"+(done[i]?" done":"");
c.innerHTML='<div class="head"><span class="date"></span><span><button>コピー</button> <label><input type="checkbox"> 予約済み</label></span></div><div class="text"></div>';
c.querySelector(".date").textContent=(i+1)+". "+p.d;c.querySelector(".text").textContent=p.t;
const b=c.querySelector("button"),cb=c.querySelector("input");cb.checked=!!done[i];
b.onclick=async()=>{try{await navigator.clipboard.writeText(p.t)}catch(e){const ta=document.createElement("textarea");ta.value=p.t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
b.textContent="コピーしました";b.classList.add("copied");setTimeout(()=>{b.textContent="コピー";b.classList.remove("copied")},1500)};
cb.onchange=()=>{done[i]=cb.checked;c.classList.toggle("done",cb.checked);save();count()};list.appendChild(c)});
document.getElementById("reset").onclick=()=>{done={};save();document.querySelectorAll("input").forEach(x=>x.checked=false);document.querySelectorAll(".card").forEach(x=>x.classList.remove("done"));count()};
count();</script></body></html>
